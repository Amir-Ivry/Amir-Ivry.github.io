<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

<script>
  // Tiny toast
  function showToast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.className = 'show';
    setTimeout(() => t.className = '', 1300);
  }

  // Copy-only share (no native share window)
  async function shareItem(anchorId, section, slug) {
    const url = location.origin + location.pathname + '#' + anchorId;
    // keep URL in address bar in case they reload/share
    history.replaceState(null, '', '#' + anchorId);

    // (optional) analytics, silent
    if (window.plausible && section && slug) {
      try { plausible('pageview', { u: location.origin + '/' + section + '/' + slug }); } catch(e){}
    }

    try {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(url);
        showToast('Link copied');
        return false;
      }
    } catch(e){}

    // fallback prompt
    window.prompt('Copy link:', url);
    return false;
  }
</script>


  
<script defer data-domain="amir-ivry.github.io" src="https://plausible.io/js/script.file-downloads.outbound-links.tagged-events.js"></script>
<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

</head>
